# Centrale verwarmingsregeling. Zie doc/07-Beheer-en-synchronisatie.md voor de UI-helpermigratie.
# Centrale verwarmingsregeling. Zie doc/07-Beheer-en-synchronisatie.md voor de UI-helpermigratie.
input_boolean:
  cv_bureel:
    name: CV_Bureel
    icon: mdi:fire-circle
  cv_nic:
    name: CV Gastenkamer
    icon: mdi:fire-circle
  cv_living_aan:
    name: CV Living
    icon: mdi:fire-circle
  cv_keuken_en_tussen_aan:
    name: CV Keuken en Tussen
    icon: mdi:fire-circle
  cv_nacht_bezig:
    name: CV_Nacht_Bezig
  cv_boost_bureel:
    name: cv_boost_bureel
    icon: mdi:speedometer
  cv_boost_living:
    name: cv_boost_living
    icon: mdi:speedometer
  cv_boost_keuken:
    name: cv_boost_keuken
    icon: mdi:speedometer
  cv_ketelsturing_ha_actief:
    name: cv_ketelsturing_ha_actief
    icon: mdi:heating-coil
  alle_cv_kranen_open_test:
    name: Alle CV kranen open (Test)
    icon: mdi:valve-open
input_number:
  temp_wens_dag:
    name: Dag Temp
    min: 15
    max: 24
    step: 0.5
    mode: slider
    icon: mdi:thermometer
    unit_of_measurement: °C
  temp_wens_nacht:
    name: Nacht Temp
    min: 14
    max: 22
    step: 0.5
    mode: slider
    icon: mdi:thermometer
    unit_of_measurement: °C
  cv_boost_aanvoer_temp:
    name: cv_boost_aanvoer_temp
    min: 45
    max: 70
    step: 1
    mode: slider
    icon: mdi:temperature-celsius
    unit_of_measurement: °C
  cv_aanvoer_setpoint:
    name: CV aanvoer stapsgewijs
    min: 0
    max: 60
    step: 2
    initial: 0
    mode: slider
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: °C
  cv_laatst_verstuurd_control_setpoint:
    name: CV laatst verstuurd ketelsetpoint
    min: -1
    max: 70
    step: 1
    mode: box
    unit_of_measurement: °C
  cv_laatst_verstuurde_buitentemperatuur:
    name: CV laatst verstuurde buitentemperatuur
    min: -50
    max: 60
    step: 0.1
    mode: box
    unit_of_measurement: °C
  cv_ramp_ref_bureel:
    name: CV ramp referentie Bureel
    min: 0
    max: 40
    step: 0.1
    initial: 0
    mode: box
    unit_of_measurement: °C
  cv_ramp_ref_living:
    name: CV ramp referentie Living
    min: 0
    max: 40
    step: 0.1
    initial: 0
    mode: box
    unit_of_measurement: °C
  cv_ramp_ref_keuken:
    name: CV ramp referentie Keuken
    min: 0
    max: 40
    step: 0.1
    initial: 0
    mode: box
    unit_of_measurement: °C
  nacht_keuken:
    name: Nacht Keuken
    min: 14.0
    max: 20.0
    step: 0.5
    mode: slider
    icon: mdi:thermometer
input_datetime:
  begin_nacht:
    name: Begin Nacht
    has_date: false
    has_time: true
    icon: mdi:clock
  cv_boost_einde_bureel:
    name: cv_boost_einde_bureel
    has_date: true
    has_time: true
    icon: mdi:delta
  cv_boost_einde_living:
    name: cv_boost_einde_living
    has_date: true
    has_time: true
    icon: mdi:delta
  cv_boost_einde_keuken:
    name: cv_boost_einde_keuken
    has_date: true
    has_time: true
    icon: mdi:delta
  cv_aanvoer_ramp_check:
    name: CV aanvoer laatste rampcontrole
    has_date: true
    has_time: true
    icon: mdi:timer-outline
counter:
  cv_counter:
    name: CV Counter
    minimum: 0
    maximum: 100
    restore: true
    initial: 0
    step: 1
automation:
- id: '1612983793178'
  alias: CV Uit op tijdstip
  description: ''
  trigger:
  - platform: time
    at: input_datetime.begin_nacht
  condition: []
  action:
  - service: counter.reset
    data: {}
    target:
      entity_id: counter.cv_counter
  - service: input_boolean.turn_off
    data: {}
    target:
      entity_id:
      - input_boolean.cv_keuken_en_tussen_aan
      - input_boolean.cv_living_aan
      - input_boolean.cv_bureel
      - input_boolean.cv_nic
  - service: input_boolean.turn_on
    data: {}
    target:
      entity_id: input_boolean.cv_nacht_bezig
  mode: single
- id: '1613123298154'
  alias: Buiten Temp -> CV
  description: Verstuur alleen een gewijzigde buitentemperatuur naar de OpenTherm Gateway.
  triggers:
  - trigger: state
    entity_id: weather.wuytskes
    attribute: temperature
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      outside_temperature: "{{ state_attr('weather.wuytskes', 'temperature') | float(0) | round(1) }}"
  - if:
    - condition: template
      value_template: "{{ is_number(state_attr('weather.wuytskes', 'temperature')) and outside_temperature | float != states('input_number.cv_laatst_verstuurde_buitentemperatuur') | float(-50) }}"
    then:
    - action: opentherm_gw.set_outside_temperature
      data:
        gateway_id: otgw
        temperature: "{{ outside_temperature | float }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.cv_laatst_verstuurde_buitentemperatuur
      data:
        value: "{{ outside_temperature | float }}"
  mode: single
- id: '1613558181388'
  alias: Verstuur wijziging Dag Temp naar CV
  description: ''
  trigger:
  - platform: state
    entity_id:
    - input_number.temp_wens_dag
  condition:
  - condition: numeric_state
    entity_id: counter.cv_counter
    above: 0
  action:
  - service: mqtt.publish
    data:
      topic: homeassistant/cv/on
      payload: '{{ states( ''input_number.temp_wens_dag'') | float }}'
      retain: true
  mode: single
- id: '1613558181390'
  alias: Verstuur wijziging Nacht Temp naar CV
  description: Enkel wanneer CV in nacht stand
  trigger:
  - platform: state
    entity_id:
    - input_number.temp_wens_nacht
  condition:
  - condition: numeric_state
    entity_id: counter.cv_counter
    below: 1
  action:
  - service: mqtt.publish
    data:
      topic: homeassistant/cv/on
      payload: '{{ states( ''input_number.temp_wens_nacht'') | float }}'
      retain: true
  mode: single
- id: '1670082642361'
  alias: 'CV: zones uitschakelen bij afwezigheid'
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.iedereen_afwezig
    from:
    - 'off'
    to:
    - 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  conditions:
  - condition: switch.is_off
    target:
      entity_id: input_boolean.l_m_blijvenaanwezig
    options:
      behavior: any
      for: 00:00:00
  actions:
  - data: {}
    target:
      entity_id:
      - input_boolean.cv_bureel
      - input_boolean.cv_living_aan
      - input_boolean.cv_keuken_en_tussen_aan
    action: input_boolean.turn_off
  mode: single
- id: '1671716447190'
  alias: CV  NachtBezig helper uitzetten op tijdstip ochtend
  description: ''
  trigger:
  - platform: time
    at: 07:00:00
  condition: []
  action:
  - service: input_boolean.turn_off
    data: {}
    target:
      entity_id: input_boolean.cv_nacht_bezig
  mode: single
- id: '1671716797761'
  alias: CV sNachts uit na 1H
  description: ''
  trigger:
  - platform: numeric_state
    entity_id: counter.cv_counter
    for:
      hours: 1
      minutes: 0
      seconds: 0
    above: 0
  condition:
  - condition: state
    entity_id: input_boolean.cv_nacht_bezig
    state: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
  action:
  - service: counter.reset
    data: {}
    target:
      entity_id: counter.cv_counter
  - service: input_boolean.turn_off
    data: {}
    target:
      entity_id:
      - input_boolean.cv_keuken_en_tussen_aan
      - input_boolean.cv_living_aan
      - input_boolean.cv_bureel
      - input_boolean.cv_nic
  mode: single
- id: '1709214333720'
  alias: 'CV: eenmalige ochtendstart'
  description: ''
  triggers:
  - at: 06:00:00
    trigger: time
  conditions: []
  actions:
  - target:
      entity_id:
      - input_boolean.cv_nacht_bezig
    data: {}
    action: input_boolean.turn_off
  - metadata: {}
    data: {}
    target:
      entity_id:
      - input_boolean.cv_living_aan
      - input_boolean.cv_keuken_en_tussen_aan
    action: input_boolean.turn_on
  - metadata: {}
    data:
      stop_actions: true
    target:
      entity_id: "{{ this.entity_id }}"
    action: automation.turn_off
  mode: single
- id: '1769860300484'
  alias: Status CV - Alle ruimtes (script)
  description: Stel de thermostatische kranen in.  Alle zones
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: script.cv_boost_zone_parameterized
    data:
      zone: Bureel
      temp_sensor: sensor.cv_bureel_temperatuur_stabiel
      cv_uit: '{{ is_state(''input_boolean.cv_bureel'',''off'') | bool }}'
  - action: script.cv_boost_zone_parameterized
    data:
      zone: Living
      temp_sensor: sensor.cv_living_temperatuur_stabiel
      cv_uit: '{{ is_state(''input_boolean.cv_living_aan'',''off'') | bool }}'
  - action: script.cv_boost_zone_parameterized
    data:
      zone: Tussen
      temp_sensor: sensor.cv_keuken_temperatuur_stabiel
      cv_uit: '{{ is_state(''input_boolean.cv_keuken_en_tussen_aan'',''off'') | bool
        }}'
  - action: script.cv_boost_zone_parameterized
    data:
      zone: Keuken
      temp_sensor: sensor.cv_keuken_temperatuur_stabiel
      cv_uit: '{{ is_state(''input_boolean.cv_keuken_en_tussen_aan'',''off'') | bool
        }}'
      hoge_prioriteit: true
  mode: single
- id: '1771337121032'
  alias: Stop boost bureel bij uitschakelen
  description: ''
  triggers:
  - entity_id: input_boolean.cv_bureel
    to: 'off'
    trigger: state
  actions:
  - target:
      entity_id: input_boolean.cv_boost_bureel
    action: input_boolean.turn_off
  mode: single
- id: '1771337144258'
  alias: Stop boost living bij uitschakelen
  description: ''
  triggers:
  - entity_id: input_boolean.cv_living_aan
    to: 'off'
    trigger: state
  actions:
  - target:
      entity_id: input_boolean.cv_boost_living
    action: input_boolean.turn_off
- id: '1771337166355'
  alias: Stop boost keuken bij uitschakelen
  description: ''
  triggers:
  - entity_id: input_boolean.cv_keuken_en_tussen_aan
    to: 'off'
    trigger: state
  actions:
  - target:
      entity_id: input_boolean.cv_boost_keuken
    action: input_boolean.turn_off
- id: '1771589685043'
  alias: CV Boost Auto Stop
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - variables:
      dag: '{{ states(''input_number.temp_wens_dag'') | float }}'
      nacht: '{{ states(''input_number.temp_wens_nacht'') | float }}'
      wens_bureel: '{{ dag if is_state(''input_boolean.cv_bureel'',''on'') else nacht
        }}'
      delta_bureel: '{{ wens_bureel - (states(''sensor.cv_bureel_temperatuur_stabiel'')
        | float(0)) }}'
      wens_living: '{{ dag if is_state(''input_boolean.cv_living_aan'',''on'') else
        nacht }}'
      delta_living: '{{ wens_living - (states(''sensor.cv_living_temperatuur_stabiel'')
        | float(0)) }}'
      wens_keuken: '{{ dag if is_state(''input_boolean.cv_keuken_en_tussen_aan'',''on'')
        else nacht }}'
      delta_keuken: '{{ wens_keuken - (states(''sensor.cv_keuken_temperatuur_stabiel'')
        | float(0)) }}'
      max_delta: '{{ [delta_bureel, delta_living, delta_keuken] | max }}'
  - if:
    - condition: template
      value_template: '{{ max_delta < 0.5 }}'
    then:
    - target:
        entity_id:
        - input_boolean.cv_boost_bureel
        - input_boolean.cv_boost_living
        - input_boolean.cv_boost_keuken
      action: input_boolean.turn_off
  mode: single
- id: '1772103141610'
  alias: CV Control Setpoint Dynamisch
  description: Open eerst de kranen; verhoog de aanvoer alleen stapsgewijs als ruimtes niet reageren.
  triggers:
  - trigger: time_pattern
    seconds: /30
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      ha_ketelsturing_actief: "{{ is_state('input_boolean.cv_ketelsturing_ha_actief', 'on') }}"
      boost_active: "{{ is_state('input_boolean.cv_boost_bureel', 'on') or is_state('input_boolean.cv_boost_living', 'on') or is_state('input_boolean.cv_boost_keuken', 'on') }}"
      boost_setpoint: "{{ states('input_number.cv_boost_aanvoer_temp') | float(60) }}"
      dag: "{{ states('input_number.temp_wens_dag') | float(21) }}"
      nacht: "{{ states('input_number.temp_wens_nacht') | float(17) }}"
      delta_bureel: "{{ (dag if is_state('input_boolean.cv_bureel','on') else nacht) - states('sensor.cv_bureel_temperatuur_stabiel') | float(0) }}"
      delta_living: "{{ (dag if is_state('input_boolean.cv_living_aan','on') else nacht) - states('sensor.cv_living_temperatuur_stabiel') | float(0) }}"
      delta_keuken: "{{ (dag if is_state('input_boolean.cv_keuken_en_tussen_aan','on') else nacht) - states('sensor.cv_keuken_temperatuur_stabiel') | float(0) }}"
      max_delta: "{{ [delta_bureel | float, delta_living | float, delta_keuken | float] | max }}"
      max_aanvoer: "{% if max_delta | float <= 0.75 %}36{% elif max_delta | float <= 1.25 %}42{% elif max_delta | float <= 2 %}50{% else %}60{% endif %}"
      ramp_setpoint: "{{ states('input_number.cv_aanvoer_setpoint') | float(0) }}"
      ramp_elapsed: "{{ (as_timestamp(now()) - as_timestamp(states('input_datetime.cv_aanvoer_ramp_check'), 0)) | int(0) }}"
      ramp_progress: "{{ (delta_bureel | float > 0.3 and states('sensor.cv_bureel_temperatuur_stabiel') | float(0) >= states('input_number.cv_ramp_ref_bureel') | float(0) + 0.2) or (delta_living | float > 0.3 and states('sensor.cv_living_temperatuur_stabiel') | float(0) >= states('input_number.cv_ramp_ref_living') | float(0) + 0.2) or (delta_keuken | float > 0.3 and states('sensor.cv_keuken_temperatuur_stabiel') | float(0) >= states('input_number.cv_ramp_ref_keuken') | float(0) + 0.2) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ not (ha_ketelsturing_actief | bool) or (boost_active | bool) or max_delta | float <= 0.3 }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.cv_aanvoer_setpoint
        data:
          value: 0
    - conditions:
      - condition: template
        value_template: "{{ ha_ketelsturing_actief | bool and not (boost_active | bool) and max_delta | float > 0.3 and ramp_setpoint | float > max_aanvoer | float }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.cv_aanvoer_setpoint
        data:
          value: "{{ max_aanvoer | float }}"
      - action: logbook.log
        data:
          name: CV Controller
          message: "Warmtevraag neemt af; aanvoer begrensd op {{ max_aanvoer }} °C."
    - conditions:
      - condition: template
        value_template: "{{ ha_ketelsturing_actief | bool and not (boost_active | bool) and max_delta | float > 0.5 and ramp_setpoint | float <= 0 }}"
      sequence:
      - repeat:
          for_each: "{{ [{'zone':'Bureel','zone_entity':'input_boolean.cv_bureel','delta':delta_bureel | float,'sensor':'sensor.cv_bureel_temperatuur_stabiel'}, {'zone':'Living','zone_entity':'input_boolean.cv_living_aan','delta':delta_living | float,'sensor':'sensor.cv_living_temperatuur_stabiel'}, {'zone':'Keuken','zone_entity':'input_boolean.cv_keuken_en_tussen_aan','delta':delta_keuken | float,'sensor':'sensor.cv_keuken_temperatuur_stabiel'}] }}"
          sequence:
          - if:
            - condition: template
              value_template: "{{ repeat.item.delta > 0.5 }}"
            then:
            - action: script.cv_boost_zone_parameterized
              data:
                zone: "{{ repeat.item.zone }}"
                cv_uit: "{{ is_state(repeat.item.zone_entity, 'off') }}"
                temp_sensor: "{{ repeat.item.sensor }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.cv_aanvoer_setpoint
        data:
          value: 30
      - repeat:
          for_each: "{{ [{'delta':delta_bureel | float,'sensor':'sensor.cv_bureel_temperatuur_stabiel','ref':'input_number.cv_ramp_ref_bureel'}, {'delta':delta_living | float,'sensor':'sensor.cv_living_temperatuur_stabiel','ref':'input_number.cv_ramp_ref_living'}, {'delta':delta_keuken | float,'sensor':'sensor.cv_keuken_temperatuur_stabiel','ref':'input_number.cv_ramp_ref_keuken'}] }}"
          sequence:
          - if:
            - condition: template
              value_template: "{{ repeat.item.delta > 0.5 }}"
            then:
            - action: input_number.set_value
              target:
                entity_id: "{{ repeat.item.ref }}"
              data:
                value: "{{ states(repeat.item.sensor) | float(0) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cv_aanvoer_ramp_check
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: logbook.log
        data:
          name: CV Controller
          message: "Warmtevraag {{ max_delta | round(2) }} °C: kranen proportioneel hoger ingesteld; aanvoer gestart op 30 °C."
    - conditions:
      - condition: template
        value_template: "{{ ha_ketelsturing_actief | bool and not (boost_active | bool) and max_delta | float > 0.3 and ramp_setpoint | float > 0 and ramp_elapsed | int >= 300 }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ ramp_progress | bool }}"
        then:
        - action: logbook.log
          data:
            name: CV Controller
            message: "Ruimtetemperatuur reageert; aanvoer blijft {{ ramp_setpoint }} °C."
        else:
        - action: input_number.set_value
          target:
            entity_id: input_number.cv_aanvoer_setpoint
          data:
            value: "{{ [ramp_setpoint | float + 2, max_aanvoer | float] | min }}"
        - action: logbook.log
          data:
            name: CV Controller
            message: "Geen meetbare ruimteverwarming; aanvoer verhoogd naar {{ [ramp_setpoint | float + 2, max_aanvoer | float] | min }} °C (limiet voor deze warmtevraag {{ max_aanvoer }} °C)."
      - repeat:
          for_each: "{{ [{'delta':delta_bureel | float,'sensor':'sensor.cv_bureel_temperatuur_stabiel','ref':'input_number.cv_ramp_ref_bureel'}, {'delta':delta_living | float,'sensor':'sensor.cv_living_temperatuur_stabiel','ref':'input_number.cv_ramp_ref_living'}, {'delta':delta_keuken | float,'sensor':'sensor.cv_keuken_temperatuur_stabiel','ref':'input_number.cv_ramp_ref_keuken'}] }}"
          sequence:
          - if:
            - condition: template
              value_template: "{{ repeat.item.delta > 0.5 }}"
            then:
            - action: input_number.set_value
              target:
                entity_id: "{{ repeat.item.ref }}"
              data:
                value: "{{ states(repeat.item.sensor) | float(0) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.cv_aanvoer_ramp_check
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - variables:
      control_setpoint: "{% if not (ha_ketelsturing_actief | bool) %}0{% elif boost_active | bool %}{{ boost_setpoint }}{% elif max_delta | float > 0.3 %}{{ [states('input_number.cv_aanvoer_setpoint') | float(0), max_aanvoer | float] | min }}{% else %}0{% endif %}"
  - variables:
      control_setpoint_rounded: "{{ control_setpoint | float | round(0) | int }}"
  - if:
    - condition: template
      value_template: "{{ control_setpoint_rounded | int != states('input_number.cv_laatst_verstuurd_control_setpoint') | int(-1) }}"
    then:
    - action: opentherm_gw.set_control_setpoint
      data:
        gateway_id: otgw
        temperature: "{{ control_setpoint_rounded | int }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.cv_laatst_verstuurd_control_setpoint
      data:
        value: "{{ control_setpoint_rounded | int }}"
    - action: logbook.log
      data:
        name: CV Controller
        message: "Warmtevraag {{ max_delta | round(2) }} °C, boost {{ boost_active }}, setpoint gewijzigd naar {{ control_setpoint_rounded }} °C."
  mode: single
  max_exceeded: silent
- id: '1772527831848'
  alias: (TEST) Alle CV kranen open
  description: Zet alle slimme radiatorkranen volledig open voor onderhoud
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.alle_cv_kranen_open_test
    to:
  actions:
  - variables:
      wens: '{{ 30 if is_state(''input_boolean.alle_cv_kranen_open_test'', ''on'')
        else states(''input_number.temp_wens_nacht'') | float }}

        '
      climates_keuken: '{% from ''rt_tools.jinja'' import rt_climates_json with context
        %} {{ rt_climates_json(''Keuken'') | from_json }}

        '
      climates_tussen: '{% from ''rt_tools.jinja'' import rt_climates_json with context
        %} {{ rt_climates_json(''Tussen'') | from_json }}

        '
      climates_living: '{% from ''rt_tools.jinja'' import rt_climates_json with context
        %} {{ rt_climates_json(''Living'') | from_json }}

        '
      climates_bureel: '{% from ''rt_tools.jinja'' import rt_climates_json with context
        %} {{ rt_climates_json(''Bureel'') | from_json }}

        '
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.alle_cv_kranen_open_test
        state: 'on'
      sequence:
      - target:
          entity_id: automation.status_cv
        data:
          stop_actions: false
        action: automation.turn_off
    default:
    - target:
        entity_id: automation.status_cv
      action: automation.turn_on
  - repeat:
      for_each: '{{ climates_keuken }}'
      sequence:
      - target:
          entity_id: '{{ repeat.item }}'
        data:
          temperature: '{{ wens }}'
        action: climate.set_temperature
  - repeat:
      for_each: '{{ climates_tussen }}'
      sequence:
      - target:
          entity_id: '{{ repeat.item }}'
        data:
          temperature: '{{ wens }}'
        action: climate.set_temperature
  - repeat:
      for_each: '{{ climates_living }}'
      sequence:
      - target:
          entity_id: '{{ repeat.item }}'
        data:
          temperature: '{{ wens }}'
        action: climate.set_temperature
  - repeat:
      for_each: '{{ climates_bureel }}'
      sequence:
      - target:
          entity_id: '{{ repeat.item }}'
        data:
          temperature: '{{ wens }}'
        action: climate.set_temperature
  mode: single
