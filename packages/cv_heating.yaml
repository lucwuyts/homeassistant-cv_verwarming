- id: '1787490299388'
  alias: ' Nest wens temperatuur overnemen voor CV'
  description: 'Neem de doeltemperatuur van de Nest over naar temp_wens_dag wanneer
    deze minstens 1 minuut ongewijzigd blijft. Bij een temperatuur lager dan 19°C
    wordt de Nest uitgeschakeld.

    '
  triggers:
  - trigger: state
    entity_id: climate.living_nest_living
    attribute: temperature
    for:
      minutes: 1
  conditions:
  - condition: template
    value_template: '{{ state_attr(''climate.living_nest_living'', ''temperature'')
      is not none }}

      '
  actions:
  - variables:
      nest_temp: '{{ state_attr(''climate.living_nest_living'', ''temperature'') |
        float }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ nest_temp < 19 }}'
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.living_nest_living
    - conditions:
      - condition: template
        value_template: '{{ nest_temp >= 19 }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.temp_wens_dag
        data:
          value: '{{ nest_temp }}'
  mode: restart
- id: '1791713214086'
  alias: CV Living koppelen aan Nest Thermostaat met Helper
  description: Stuurt de Nest aan op basis van de schakelaar en de gewenste 
    dagtemperatuur
  triggers:
  - trigger: state
    entity_id: input_boolean.cv_living_aan
  - trigger: state
    entity_id: input_number.temp_wens_dag
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.cv_living_aan
        state: 'on'
      sequence:
      - action: climate.turn_on
        metadata: {}
        target:
          entity_id: climate.living_nest_living
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 30
          milliseconds: 0
      - action: climate.set_temperature
        target:
          device_id: 55c1d0be54ea62336f56648646771842
        data:
          temperature: '{{ states(''input_number.temp_wens_dag'') | float }}'
    - conditions:
      - condition: state
        entity_id: input_boolean.cv_living_aan
        state: 'off'
      sequence:
      - action: climate.turn_off
        metadata: {}
        target:
          entity_id: climate.living_nest_living
        data: {}
  mode: single
script:
  cv_boost_zone_parameterized:
    alias: CV boost zone (parameterized)
    description: Stel Tado kranen proportioneel in; houd ze bij groot tekort langer volledig open.
    mode: single
    fields:
      zone:
        name: Zone
        required: true
        selector:
          text:
      cv_uit:
        name: CV uit
        required: true
        selector:
          boolean:
      huidige_temp:
        name: Huidige temperatuur (optioneel)
        required: false
        selector:
          number:
            min: -20
            max: 50
            step: 0.1
            mode: box
      temp_sensor:
        name: Temperatuursensor (optioneel)
        required: false
        selector:
          entity:
            domain: sensor
      hoge_prioriteit:
        name: Hoge Prioriteit (optioneel)
        required: false
        selector:
          boolean:
    sequence:
    - variables:
        nacht: '{{ cv_uit }}'
        rt_list: '{% from ''rt_tools.jinja'' import rt_climates_json with context
          %} {{ rt_climates_json(zone) | from_json }}

          '
        basis: "{{ states('input_number.temp_wens_nacht') | float(17)\n   if nacht
          else\n   states('input_number.temp_wens_dag') | float(20) }}\n"
        huidige_temp_resolved: "{% if huidige_temp is defined and huidige_temp is
          not none %}\n  {{ huidige_temp | float }}\n{% elif temp_sensor is defined
          and temp_sensor %}\n  {{ states(temp_sensor) | float(0) }}\n{% else %}\n\
          \  0\n{% endif %}\n"
        delta: '{{ (basis - huidige_temp_resolved) | round(2) }}

          '
        boost_active: '{% set boost_zone = ''keuken'' if zone | lower == ''tussen''
          else zone | lower %}

          {{ is_state(''input_boolean.cv_boost_'' ~ boost_zone, ''on'') }}

          '
    - repeat:
        for_each: '{{ rt_list }}'
        sequence:
        - variables:
            rt_entity: '{{ repeat.item }}'
            kraan_temp: '{{ state_attr(rt_entity, ''current_temperature'') | float(0)
              }}

              '
            bias_raw: '{{ (kraan_temp - huidige_temp_resolved) }}

              '
            bias: "{% if bias_raw > 2 %}\n  2\n{% elif bias_raw < 0 %}\n  0\n{% else
              %}\n  {{ bias_raw }}\n{% endif %}\n"
            huidig_setpoint: '{{ state_attr(rt_entity, ''temperature'') | float(0)
              }}

              '
            berekend_setpoint: "{% if boost_active or delta > 2 %}\n  30\n{% elif huidig_setpoint >= 29.9 and delta > 1.5 %}\n  30\n{% elif delta > 0 %}\n  {{ [basis + (delta * 3), 30] | min | round(1) }}\n{% else %}\n  {{ basis }}\n{% endif %}\n"
            new_setpoint: "{% if (berekend_setpoint - huidig_setpoint) | abs < 0.2
              %}\n  {{ huidig_setpoint }}\n{% else %}\n  {{ berekend_setpoint }}\n\
              {% endif %}\n"
        - target:
            entity_id: input_number.debug_setpoint_{{zone | lower }}
          data:
            value: '{{ new_setpoint }}'
          action: input_number.set_value
        - target:
            entity_id: '{{ rt_entity }}'
          data:
            temperature: '{{ new_setpoint }}'
          action: climate.set_temperature
  cv_boost_zone_slim:
    alias: CV boost zone (slim)
    mode: restart
    fields:
      zone:
        required: true
        selector:
          text:
      cv_uit:
        required: true
        selector:
          boolean:
      temp_sensor:
        required: true
        selector:
          entity:
            domain: sensor
    sequence:
    - variables:
        zone_boolean: "{% if zone == \"Bureel\" %}\n  input_boolean.cv_bureel\n{%
          elif zone == \"Living\" %}\n  input_boolean.cv_living_aan\n{% elif zone
          == \"Keuken\" %}\n  input_boolean.cv_keuken_en_tussen_aan\n{% endif %}\n"
    - target:
        entity_id: 'input_datetime.cv_boost_einde_{{ zone | lower }}

          '
      data:
        datetime: '{{ (now() + timedelta(minutes=60)).strftime(''%Y-%m-%d %H:%M:%S'')
          }}

          '
      action: input_datetime.set_datetime
    - target:
        entity_id: '{{ zone_boolean }}

          '
      action: input_boolean.turn_on
    - target:
        entity_id: 'input_boolean.cv_boost_{{ zone | lower }}

          '
      action: input_boolean.turn_on
    - repeat:
        count: 60
        sequence:
        - variables:
            target_temp: '{{ states(''input_number.temp_wens_dag'') | float }}

              '
            huidige_temp: '{{ states(temp_sensor) | float(0) }}

              '
            delta: '{{ target_temp - huidige_temp }}

              '
        - if:
          - condition: template
            value_template: '{{ delta <= 0.2 }}'
          then:
          - target:
              entity_id: 'input_boolean.cv_boost_{{ zone | lower }}

                '
            action: input_boolean.turn_off
          - stop: Temperatuur bereikt
        - if:
          - condition: template
            value_template: '{{ cv_uit }}'
          then:
          - target:
              entity_id: 'input_boolean.cv_boost_{{ zone | lower }}

                '
            action: input_boolean.turn_off
          - stop: Zone uitgeschakeld
        - delay: 00:01:00
    - target:
        entity_id: 'input_boolean.cv_boost_{{ zone | lower }}

          '
      action: input_boolean.turn_off
    description: ''
  settempbureel_dag:
    alias: DAG  SetTempBureel
    mode: single
    icon: mdi:temperature-celsius
    sequence:
    - repeat:
        for_each: '{{ area_entities(''bureel'')  }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ ''settopic'' in repeat.item }}'
          then:
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) | replace(''set'' , ''ruimte'') }} '
              payload: bureel
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) }}'
              payload: '{{ states(''input_number.temp_wens_dag'') }}'
  settempbureel_nacht:
    alias: NACHT SetTempBureel
    sequence:
    - repeat:
        for_each: '{{ area_entities(''bureel'')  }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ ''settopic'' in repeat.item }}'
          then:
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) }}'
              payload: '{{ states(''input_number.temp_wens_nacht'') }}'
    mode: single
    icon: mdi:temperature-celsius
  settempkeuken_dag:
    alias: DAG SetTempKeuken
    sequence:
    - repeat:
        for_each: '{{ area_entities(''keuken'')  }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ ''settopic'' in repeat.item }}'
          then:
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) | replace(''set'' , ''ruimte'') }} '
              payload: keuken
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) }}'
              payload: '{{ states(''input_number.temp_wens_dag'') }}'
    mode: single
    icon: mdi:temperature-celsius
  settempkeuken_nacht:
    alias: NACHT SetTempKeuken
    sequence:
    - repeat:
        for_each: '{{ area_entities(''keuken'')  }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ ''settopic'' in repeat.item }}'
          then:
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) }}'
              payload: '{{ states(''input_number.nacht_keuken'') }}'
    mode: single
    icon: mdi:temperature-celsius
  settemptussen_dag:
    alias: DAG SetTempTussen
    sequence:
    - repeat:
        for_each: '{{ area_entities(''tussen'')  }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ ''settopic'' in repeat.item }}'
          then:
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) | replace(''set'' , ''ruimte'') }} '
              payload: tussen
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) }}'
              payload: '{{ states(''input_number.temp_wens_dag'') }}'
    mode: single
    icon: mdi:temperature-celsius
  settemptussen_nacht:
    alias: NACHT SetTempTussen
    sequence:
    - repeat:
        for_each: '{{ area_entities(''tussen'')  }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ ''settopic'' in repeat.item }}'
          then:
          - service: mqtt.publish
            data:
              topic: '{{ states(repeat.item) }}'
              payload: '{{ states(''input_number.nacht_keuken'') }}'
    mode: single
    icon: mdi:temperature-celsius
template:
- trigger:
  - platform: state
    entity_id: sensor.atc_d897_temperature
  sensor:
  - name: CV Bureel Temperatuur Stabiel
    unique_id: cv_bureel_temperatuur_stabiel
    unit_of_measurement: °C
    device_class: temperature
    state: "{% set waarde = trigger.to_state.state %} {% if waarde | is_number %}\n\
      \  {{ waarde | float | round(1) }}\n{% else %}\n  {{ this.state if this.state
      | is_number else none }}\n{% endif %}\n"
- trigger:
  - platform: state
    entity_id: sensor.living_nest_living_temperatuur
  sensor:
  - name: CV Living Temperatuur Stabiel
    unique_id: cv_living_temperatuur_stabiel
    unit_of_measurement: °C
    device_class: temperature
    state: "{% set waarde = trigger.to_state.state %} {% if waarde | is_number %}\n\
      \  {{ waarde | float | round(1) }}\n{% else %}\n  {{ this.state if this.state
      | is_number else none }}\n{% endif %}\n"
- trigger:
  - platform: state
    entity_id: sensor.keuken_thermometer_bt_temperature
  sensor:
  - name: CV Keuken Temperatuur Stabiel
    unique_id: cv_keuken_temperatuur_stabiel
    unit_of_measurement: °C
    device_class: temperature
    state: "{% set waarde = trigger.to_state.state %} {% if waarde | is_number %}\n\
      \  {{ waarde | float | round(1) }}\n{% else %}\n  {{ this.state if this.state
      | is_number else none }}\n{% endif %}\n"
- switch:
  - name: Verwarming dummy
    unique_id: verwarming_dummy
    state: "{{ is_state('input_boolean.cv_living_aan','on')\n   or is_state('input_boolean.cv_bureel','on')\n\
      \   or is_state('input_boolean.cv_keuken_en_tussen_aan','on') }}\n"
    turn_on:
    - service: input_boolean.turn_on
      target:
        entity_id:
        - input_boolean.cv_living_aan
        - input_boolean.cv_bureel
        - input_boolean.cv_keuken_en_tussen_aan
    turn_off:
    - service: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.cv_living_aan
        - input_boolean.cv_bureel
        - input_boolean.cv_keuken_en_tussen_aan
- sensor:
  - name: Gemiddelde actieve zones
    unique_id: gemiddelde_actieve_zones
    unit_of_measurement: °C
    state: "{% set temps = [] %}\n{% if is_state('input_boolean.cv_bureel','on') %}\n\
      \  {% set temps = temps + [states('sensor.cv_bureel_temperatuur_stabiel')|float(0)]
      %}\n{% endif %}\n{% if is_state('input_boolean.cv_living_aan','on') %}\n  {%
      set temps = temps + [states('sensor.cv_living_temperatuur_stabiel')|float(0)]
      %}\n{% endif %}\n{% if is_state('input_boolean.cv_keuken_en_tussen_aan','on')
      %}\n  {% set temps = temps + [states('sensor.cv_keuken_temperatuur_stabiel')|float(0)]
      %}\n{% endif %}\n{% if temps | length > 0 %}\n  {{ (temps | sum / temps | length)
      | round(1) }}\n{% else %}\n  {{ states('sensor.cv_living_temperatuur_stabiel')
      | float(0) }}\n{% endif %}\n"
- sensor:
  - name: CV Debug Status
    state: '{% set dag = states(''input_number.temp_wens_dag'') | float %} {% set
      nacht = states(''input_number.temp_wens_nacht'') | float %}

      {% set wens_bureel = dag if is_state(''input_boolean.cv_bureel'',''on'') else
      nacht %} {% set delta_bureel = wens_bureel - (states(''sensor.cv_bureel_temperatuur_stabiel'')
      | float(0)) %}

      {% set wens_living = dag if is_state(''input_boolean.cv_living_aan'',''on'')
      else nacht %} {% set delta_living = wens_living - (states(''sensor.cv_living_temperatuur_stabiel'')
      | float(0)) %}

      {% set wens_keuken = dag if is_state(''input_boolean.cv_keuken_en_tussen_aan'',''on'')
      else nacht %} {% set delta_keuken = wens_keuken - (states(''sensor.cv_keuken_temperatuur_stabiel'')
      | float(0)) %}

      {% set max_delta = [delta_bureel, delta_living, delta_keuken] | max %}

      MaxΔ={{ max_delta | round(2) }}

      '
    attributes:
      bureel_delta: "{{ (states('input_number.temp_wens_dag') | float\n    - states('sensor.cv_bureel_temperatuur_stabiel')
        | float(0)) | round(2) }}\n"
      living_delta: "{{ (states('input_number.temp_wens_dag') | float\n    - states('sensor.cv_living_temperatuur_stabiel')
        | float(0)) | round(2) }}\n"
      keuken_delta: "{{ (states('input_number.temp_wens_dag') | float\n    - states('sensor.cv_keuken_temperatuur_stabiel')
        | float(0)) | round(2) }}\n"
- sensor:
  - name: Tado Bureel Deur Setpoint
    unique_id: tado_bureel_deur_setpoint
    unit_of_measurement: °C
    state: '{{ state_attr(''climate.smart_radiator_thermostat_x_3'', ''temperature'')
      | float(0) }}

      '
- sensor:
  - name: Tado Bureel Venster Setpoint
    unique_id: tado_bureel_venster_setpoint
    unit_of_measurement: °C
    state: '{{ state_attr(''climate.smart_radiator_thermostat_x_4'', ''temperature'')
      | float(0) }}

      '
